name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # The plugin ships no runtime dependency, so there is no lock file to
      # install from; the development toolchain is resolved fresh each run.
      - name: Install development tooling
        run: composer update --no-interaction --no-progress --prefer-dist

      # Each gate runs even when an earlier one failed, so one push reports
      # every problem instead of only the first, and each writes its output to
      # the run summary where it can be read without downloading an artifact.
      - name: Coding standards
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          composer run lint 2>&1 | tee -a ci-report.txt

      - name: Static analysis
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          composer run analyse 2>&1 | tee -a ci-report.txt

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          composer run test 2>&1 | tee -a ci-report.txt

      # The run summary and the logs both require signing in to read. Workflow
      # annotations do not, so the outcome is also emitted as an annotation:
      # that is the only channel that carries a result off a private log and
      # onto a page anyone can open.
      - name: Publish report
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## PHP ${{ matrix.php }}"
            echo '```'
            cat ci-report.txt 2>/dev/null || echo 'No output was captured.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ '${{ job.status }}' = 'success' ]; then
            tests=$(grep -Eo 'OK \([0-9]+ tests?, [0-9]+ assertions?\)' ci-report.txt | tail -n 1)
            echo "::notice title=PHP ${{ matrix.php }} passed::${tests:-all gates passed}"
          else
            tail -n 8 ci-report.txt | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=PHP ${{ matrix.php }} failed::${line}"
            done
          fi

  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Check exactly what would be submitted, not the repository. The build
      # below reproduces the WordPress.org artefact: development files removed
      # through .distignore, the updater dropped, and the Update URI header
      # stripped, because guideline 8 forbids a hosted plugin from updating
      # itself from elsewhere.
      - name: Build the WordPress.org artefact
        run: |
          mkdir -p build/course-schedule-connector
          rsync -a --exclude-from=.distignore --exclude='build' ./ build/course-schedule-connector/
          rm -rf build/course-schedule-connector/includes/Updater
          sed -i '/^ \* Update URI:/d' build/course-schedule-connector/course-schedule-connector.php
          ! grep -q 'Update URI' build/course-schedule-connector/course-schedule-connector.php
          echo 'Files in the artefact:'
          find build/course-schedule-connector -type f | sort

      - name: Run Plugin Check
        if: ${{ !cancelled() }}
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: 'build/course-schedule-connector'
          slug: 'course-schedule-connector'

      - name: Publish report
        if: ${{ !cancelled() }}
        run: |
          results="${RUNNER_TEMP}/plugin-check-results.txt"

          {
            echo '## Plugin Check'
            echo '```json'
            cat "$results" 2>/dev/null || echo 'No results file was produced.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ '${{ job.status }}' = 'success' ]; then
            echo "::notice title=Plugin Check passed::No errors or warnings in the WordPress.org artefact."
          else
            head -c 1500 "$results" 2>/dev/null | tr '\n' ' ' | while IFS= read -r line; do
              echo "::error title=Plugin Check failed::${line}"
            done
          fi

  # The JavaScript job is added in the phase that introduces the block and the
  # Divi modules. Until then the plugin ships no JavaScript, and a build step
  # with nothing to build only produces noise.
