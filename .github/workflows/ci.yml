name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # The plugin ships no runtime dependency, so there is no lock file to
      # install from; the development toolchain is resolved fresh each run.
      - name: Install development tooling
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Coding standards
        run: composer run lint

      - name: Static analysis
        run: composer run analyse

      - name: Unit tests
        run: composer run test

  plugin-check:
    name: WordPress.org Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Check exactly what would be submitted, not the repository. The build
      # below reproduces the WordPress.org artefact: development files removed
      # through .distignore, the updater dropped, and the Update URI header
      # stripped, because guideline 8 forbids a hosted plugin from updating
      # itself from elsewhere.
      - name: Build the WordPress.org artefact
        run: |
          mkdir -p build/course-schedule-connector
          rsync -a --exclude-from=.distignore --exclude='build' ./ build/course-schedule-connector/
          rm -rf build/course-schedule-connector/includes/Updater
          sed -i '/^ \* Update URI:/d' build/course-schedule-connector/course-schedule-connector.php
          ! grep -q 'Update URI' build/course-schedule-connector/course-schedule-connector.php

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: 'build/course-schedule-connector'
          slug: 'course-schedule-connector'

  # The JavaScript job is added in the phase that introduces the block and the
  # Divi modules. Until then the plugin ships no JavaScript, and a build step
  # with nothing to build only produces noise.
