name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        run: |
          composer install --no-dev --optimize-autoloader
          npm ci
          npm run build
          npm run makepot

      - name: Verify the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(grep -oP '^\s*\*\s*Version:\s*\K[0-9a-zA-Z.\-]+' course-schedule-connector.php)
          README_VERSION=$(grep -oP '^Stable tag:\s*\K[0-9a-zA-Z.\-]+' readme.txt)
          echo "tag=$TAG header=$FILE_VERSION readme=$README_VERSION"
          test "$TAG" = "$FILE_VERSION"
          test "$TAG" = "$README_VERSION"

      - name: Stage distribution files
        run: |
          mkdir -p build/course-schedule-connector
          rsync -a --exclude-from=.distignore ./ build/course-schedule-connector/

      - name: Package the GitHub build
        run: |
          cd build
          zip -qr ../course-schedule-connector.zip course-schedule-connector
          cd ..

      - name: Package the WordPress.org build
        run: |
          cp -r build/course-schedule-connector build/wporg
          rm -rf build/wporg/includes/Updater
          cd build/wporg
          zip -qr ../../course-schedule-connector-wporg.zip .
          cd ../..

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            course-schedule-connector.zip
            course-schedule-connector-wporg.zip
